name: Run Booking Automation

on:
  workflow_dispatch:

  schedule:
    - cron: "35 12 * * 0,1,2,3"

jobs:
  booking:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MEMBERSHIP_NO: ${{ secrets.MEMBERSHIP_NO }}
      PASSWORD: ${{ secrets.PASSWORD }}
      # Change this to the venue's actual opening rule.
      DAYS_BEFORE: 4
      OPENING_TIME: "21:00"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project dependencies
        run: uv sync --locked

      - name: Install Playwright browser
        run: uv run rfbrowser init

      - name: Calculate booking values
        id: booking_values
        run: |
          opening_date="$(TZ=Asia/Kuala_Lumpur date +%F)"
          booking_date="$(TZ=Asia/Kuala_Lumpur date -d "$opening_date + $DAYS_BEFORE days" +%d/%b/%Y)"
          opening_time="$(TZ=Asia/Kuala_Lumpur date +%F) ${OPENING_TIME}"

          echo "booking_date=${booking_date}" >> "$GITHUB_OUTPUT"
          echo "booking_opens_at=${opening_time}" >> "$GITHUB_OUTPUT"

      - name: Run booking automation
        run: >-
          uv run robot
          --variable HEADLESS:True
          --variable BOOKING_DATE:"${{ steps.booking_values.outputs.booking_date }}"
          --variable BOOKING_OPENS_AT:"${{ steps.booking_values.outputs.booking_opens_at }}"
          booking.robot

      - name: Upload Robot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: |
            output.xml
            log.html
            report.html
